<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>A little question for you 💕</title>
<!-- Pixel fonts: Press Start 2P for headings/buttons, Pixelify Sans for body copy -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>💗</text></svg>" />
</head>
<body>

  <!-- Soft floating background hearts (pure decoration) -->
  <div class="bg-hearts" aria-hidden="true"></div>

  <!-- Confetti lives on its own full-screen canvas -->
  <canvas id="confetti" aria-hidden="true"></canvas>

  <main class="app">

    <!-- Pixel-art mascot: persists across every screen, bobs gently -->
    <div class="mascot-wrap" id="mascot-wrap" aria-hidden="true">
      <div class="bubble" id="mascot-bubble" hidden><span id="bubble-text"></span></div>
      <svg id="mascot" class="mascot" viewBox="0 0 16 16" shape-rendering="crispEdges"></svg>
      <div class="mascot-shadow"></div>
    </div>

    <div class="card">

      <!-- 0. LOADING (shown first, ~5s, full of pixel animals) -->
      <section class="screen is-active" id="screen-loading">
        <h1 class="title" id="loading-title"></h1>

        <!-- the parade of little pixel critters -->
        <div class="critters" id="critters" aria-hidden="true"></div>

        <!-- chunky pixel progress bar -->
        <div class="loadbar-wrap" aria-hidden="true">
          <div class="loadbar" id="loadbar"></div>
          <div class="loadheart" id="loadheart"></div>
        </div>
        <p class="loadpct" id="loading-status"></p>

        <button class="btn btn-primary btn-pop" id="btn-loading-continue" hidden></button>
      </section>

      <!-- 1. LANDING -->
      <section class="screen" id="screen-landing">
        <h1 class="title" id="landing-title"></h1>
        <p class="subtitle" id="landing-subtitle"></p>
        <button class="btn btn-primary" id="btn-start"></button>
      </section>

      <!-- 2 & 3. GREETING + FLIRTY LINES (all share one typing screen) -->
      <section class="screen" id="screen-typing">
        <p class="typed" id="typed-text"></p>
        <p class="hint" id="typing-hint">tap the text to skip</p>
        <button class="btn btn-primary" id="btn-typing-continue" disabled>Continue</button>
      </section>

      <!-- 4. THE ASK -->
      <section class="screen" id="screen-ask">
        <h2 class="title" id="ask-question"></h2>
        <p class="reaction" id="no-reaction"></p>
        <div class="ask-buttons">
          <button class="btn btn-yes" id="btn-yes"></button>
          <button class="btn btn-no" id="btn-no"></button>
        </div>
      </section>

      <!-- 5. CELEBRATION -->
      <section class="screen" id="screen-celebrate">
        <h1 class="title big" id="celebrate-title"></h1>
        <p class="subtitle" id="celebrate-subtitle"></p>
        <button class="btn btn-primary" id="btn-celebrate-continue">Continue</button>
      </section>

      <!-- 6. DATE PICKER -->
      <section class="screen" id="screen-date">
        <h2 class="title" id="date-title"></h2>
        <div class="calendar">
          <div class="cal-head">
            <button class="cal-nav" id="cal-prev" aria-label="Previous month">‹</button>
            <span class="cal-month" id="cal-month"></span>
            <button class="cal-nav" id="cal-next" aria-label="Next month">›</button>
          </div>
          <div class="cal-dow">
            <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
          </div>
          <div class="cal-grid" id="cal-grid"></div>
        </div>
        <p class="picked" id="date-picked"></p>
        <button class="btn btn-primary" id="btn-date-continue" disabled>Continue</button>
      </section>

      <!-- 7. ACTIVITY PICKER -->
      <section class="screen" id="screen-activity">
        <h2 class="title" id="activity-title"></h2>
        <div class="activity-grid" id="activity-grid"></div>

        <!-- Free-text option: she can type her own idea instead of picking a card -->
        <label class="own-idea" for="activity-other">
          <span id="activity-other-label"></span>
          <input type="text" id="activity-other" maxlength="60" autocomplete="off" />
        </label>

        <button class="btn btn-primary" id="btn-activity-continue" disabled>Continue</button>
      </section>

      <!-- 8. FINAL -->
      <section class="screen" id="screen-final">
        <h1 class="title big" id="final-title"></h1>
        <p class="subtitle" id="final-message"></p>
        <div class="summary" id="final-summary"></div>
        <p class="signoff" id="final-signoff"></p>
      </section>

    </div>
  </main>

  <script src="sound.js"></script>
  <script src="script.js"></script>
</body>
</html>
